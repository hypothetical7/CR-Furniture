<svg viewBox="0 0 1400 1500" xmlns="http://www.w3.org/2000/svg" font-family="'Fraunces','Iowan Old Style','Georgia',serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .sans { font-family: 'Inter','Helvetica Neue',Arial,sans-serif; }
    </style>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1400" height="1500" fill="#EFE4D3"/>

  <!-- ============ PRESENTATION LABEL ============ -->
  <text x="70" y="60" class="sans" font-size="15" letter-spacing="0.5" fill="#6B5A48">CR Furniture and Interior — logo concepts</text>
  <line x1="70" y1="78" x2="1330" y2="78" stroke="#C9B79C" stroke-width="1"/>

  <!-- ============ PANEL 1: PRIMARY LOCKUP (light) ============ -->
  <g>
    <rect x="70" y="120" width="1260" height="320" fill="#F6EEE0" stroke="#DCCBAE" stroke-width="1"/>
    <text x="100" y="152" class="sans" font-size="13" letter-spacing="0.4" fill="#8A7A64">Primary lockup</text>

    <!-- monogram: blueprint corner-marks + joined C/R -->
    <g transform="translate(150,190)">
      <!-- corner marks -->
      <path d="M0,0 H46 M0,0 V46" stroke="#A8542E" stroke-width="7" stroke-linecap="square" fill="none"/>
      <path d="M200,200 H154 M200,200 V154" stroke="#A8542E" stroke-width="7" stroke-linecap="square" fill="none"/>
      <!-- monogram letters -->
      <text x="18" y="168" font-size="168" font-weight="600" fill="#4A2E1F">C</text>
      <text x="80" y="168" font-size="168" font-weight="600" fill="#A8542E">R</text>
    </g>

    <!-- wordmark -->
    <text x="430" y="255" font-size="58" font-weight="600" fill="#241F1C">CR Furniture</text>
    <text x="430" y="315" font-size="58" font-weight="600" fill="#241F1C">and Interior</text>
    <text x="432" y="355" class="sans" font-size="20" letter-spacing="1.5" fill="#8A7A64">DAMAK, NEPAL</text>
  </g>

  <!-- ============ PANEL 2: REVERSED / DARK LOCKUP ============ -->
  <g>
    <rect x="70" y="470" width="1260" height="320" fill="#241F1C"/>
    <text x="100" y="502" class="sans" font-size="13" letter-spacing="0.4" fill="#B8A98D">Reversed, for dark backgrounds</text>

    <g transform="translate(150,540)">
      <path d="M0,0 H46 M0,0 V46" stroke="#B8875B" stroke-width="7" stroke-linecap="square" fill="none"/>
      <path d="M200,200 H154 M200,200 V154" stroke="#B8875B" stroke-width="7" stroke-linecap="square" fill="none"/>
      <text x="18" y="168" font-size="168" font-weight="600" fill="#F6EEE0">C</text>
      <text x="80" y="168" font-size="168" font-weight="600" fill="#B8875B">R</text>
    </g>

    <text x="430" y="605" font-size="58" font-weight="600" fill="#F6EEE0">CR Furniture</text>
    <text x="430" y="665" font-size="58" font-weight="600" fill="#F6EEE0">and Interior</text>
    <text x="432" y="705" class="sans" font-size="20" letter-spacing="1.5" fill="#B8A98D">DAMAK, NEPAL</text>
  </g>

  <!-- ============ PANEL 3: MONOGRAM BADGE + STACKED LOCKUP ============ -->
  <g>
    <rect x="70" y="820" width="600" height="360" fill="#F6EEE0" stroke="#DCCBAE" stroke-width="1"/>
    <text x="100" y="852" class="sans" font-size="13" letter-spacing="0.4" fill="#8A7A64">Monogram, for favicon &amp; social</text>

    <circle cx="250" cy="1010" r="115" fill="#4A2E1F"/>
    <g transform="translate(178,930)">
      <path d="M0,0 H30 M0,0 V30" stroke="#B8875B" stroke-width="6" stroke-linecap="square" fill="none"/>
      <path d="M144,144 H114 M144,144 V114" stroke="#B8875B" stroke-width="6" stroke-linecap="square" fill="none"/>
      <text x="10" y="120" font-size="120" font-weight="600" fill="#F6EEE0">C</text>
      <text x="55" y="120" font-size="120" font-weight="600" fill="#B8875B">R</text>
    </g>

    <rect x="450" y="895" width="180" height="180" fill="#EFE4D3" stroke="#DCCBAE" stroke-width="1"/>
    <g transform="translate(483,915)">
      <path d="M0,0 H24 M0,0 V24" stroke="#A8542E" stroke-width="5" stroke-linecap="square" fill="none"/>
      <path d="M114,114 H90 M114,114 V90" stroke="#A8542E" stroke-width="5" stroke-linecap="square" fill="none"/>
      <text x="6" y="95" font-size="96" font-weight="600" fill="#4A2E1F">C</text>
      <text x="42" y="95" font-size="96" font-weight="600" fill="#A8542E">R</text>
    </g>
  </g>

  <g>
    <rect x="710" y="820" width="620" height="360" fill="#F6EEE0" stroke="#DCCBAE" stroke-width="1"/>
    <text x="740" y="852" class="sans" font-size="13" letter-spacing="0.4" fill="#8A7A64">Stacked lockup, for square formats</text>

    <g transform="translate(945,900)">
      <path d="M0,0 H36 M0,0 V36" stroke="#A8542E" stroke-width="6" stroke-linecap="square" fill="none"/>
      <path d="M150,150 H114 M150,150 V114" stroke="#A8542E" stroke-width="6" stroke-linecap="square" fill="none"/>
      <text x="10" y="125" font-size="126" font-weight="600" fill="#4A2E1F">C</text>
      <text x="58" y="125" font-size="126" font-weight="600" fill="#A8542E">R</text>
    </g>
    <text x="1020" y="1125" font-size="34" font-weight="600" fill="#241F1C" text-anchor="middle">FURNITURE</text>
    <text x="1020" y="1160" font-size="34" font-weight="600" fill="#241F1C" text-anchor="middle">AND INTERIOR</text>
    <text x="1020" y="1145" font-size="1" fill="none"> </text>
  </g>

  <!-- ============ PANEL 4: COLOR + TYPE SPEC ============ -->
  <g>
    <text x="100" y="1230" class="sans" font-size="13" letter-spacing="0.4" fill="#8A7A64">Color palette</text>

    <rect x="100" y="1245" width="90" height="90" fill="#4A2E1F"/>
    <text x="100" y="1352" class="sans" font-size="13" fill="#4A2E1F">Walnut</text>
    <text x="100" y="1370" class="sans" font-size="12" fill="#8A7A64">#4A2E1F</text>

    <rect x="220" y="1245" width="90" height="90" fill="#A8542E"/>
    <text x="220" y="1352" class="sans" font-size="13" fill="#4A2E1F">Rust joint</text>
    <text x="220" y="1370" class="sans" font-size="12" fill="#8A7A64">#A8542E</text>

    <rect x="340" y="1245" width="90" height="90" fill="#B8875B"/>
    <text x="340" y="1352" class="sans" font-size="13" fill="#4A2E1F">Oak</text>
    <text x="340" y="1370" class="sans" font-size="12" fill="#8A7A64">#B8875B</text>

    <rect x="460" y="1245" width="90" height="90" fill="#241F1C" stroke="#DCCBAE"/>
    <text x="460" y="1352" class="sans" font-size="13" fill="#4A2E1F">Ink</text>
    <text x="460" y="1370" class="sans" font-size="12" fill="#8A7A64">#241F1C</text>

    <rect x="580" y="1245" width="90" height="90" fill="#F6EEE0" stroke="#DCCBAE"/>
    <text x="580" y="1352" class="sans" font-size="13" fill="#4A2E1F">Paper</text>
    <text x="580" y="1370" class="sans" font-size="12" fill="#8A7A64">#F6EEE0</text>
  </g>

  <g>
    <text x="760" y="1230" class="sans" font-size="13" letter-spacing="0.4" fill="#8A7A64">Typography</text>
    <text x="760" y="1290" font-size="34" font-weight="600" fill="#241F1C">Fraunces — display &amp; wordmark</text>
    <text x="760" y="1340" class="sans" font-size="24" fill="#241F1C">Inter — labels, tagline, UI text</text>
    <text x="760" y="1380" class="sans" font-size="13" fill="#8A7A64">The corner marks echo a site-plan drawing; the joined C/R reads as a joint in solid wood.</text>
  </g>

</svg>
